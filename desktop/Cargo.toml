[package]
name = "sala-de-tela"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
getrandom = "0.3"
hmac = "0.13"
if-addrs = "0.15"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.19"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["socket", "uio", "net"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
lto = "thin"
