<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de Tela</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sala de Tela</h1>
    <span id="status-servidor" class="pilula">conectando…</span>
  </header>

  <main>
    <aside>
      <h2>Ao vivo agora</h2>
      <ul id="lista"></ul>
      <p id="vazio" class="dica">Ninguém transmitindo. Quando alguém começar, aparece aqui sozinho.</p>
      <p class="dica">Para transmitir a <b>sua</b> tela, use o atalho <b>"Transmitir minha tela"</b> da Área de Trabalho.</p>
    </aside>

    <section id="palco">
      <div id="moldura">
        <video id="video" autoplay muted playsinline></video>
        <div id="aviso">Escolha uma transmissão na lista.</div>
      </div>
      <div id="controles">
        <span id="assistindo"></span>
        <button id="btn-som" disabled>🔇 Ativar som</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <button id="btn-cheia" disabled>⛶ Tela cheia</button>
        <button id="btn-parar" disabled>■ Parar</button>
      </div>
    </section>
  </main>

  <script src="sala.js"></script>
</body>
</html>
