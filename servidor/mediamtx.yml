# Configuração do MediaMTX para a Sala de Tela (testada com MediaMTX v1.21.2).
# Chaves omitidas usam o valor padrão do MediaMTX.

logLevel: info

# Só o WebRTC é usado: WHIP (quem transmite) e WHEP (quem assiste).
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcAllowOrigins: ["*"]

# A API fica só no localhost; a página web consulta ela pelo sala_web.py.
api: true
apiAddress: 127.0.0.1:9997

# Quem está dentro da VPN (faixa do Tailscale) pode transmitir e assistir.
# A ACL do Tailscale garante que só os amigos chegam até aqui, e o ufw
# só libera as portas na interface tailscale0.
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1", "100.64.0.0/10", "fd7a:115c:a1e0::/48"]
    permissions:
      - action: publish
      - action: read
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api

paths:
  # Cada pessoa transmite no próprio caminho (/piedro, /joao, ...).
  all_others:
