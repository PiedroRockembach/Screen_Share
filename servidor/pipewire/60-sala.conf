# Sala de Tela: saída virtual "Sala" (instalada pelo setup-linux.sh).
#
# O sala_audio.py move todos os apps, MENOS o Discord, para a "Sala".
# A "Sala" repassa o som para a saída padrão (seu fone/caixa), então você
# continua ouvindo tudo. O OBS captura só o monitor da "Sala", então a voz
# da chamada do Discord nunca entra na transmissão.
#
# Em caso de falha (o script parado, por exemplo), os apps tocam direto na
# saída padrão e simplesmente não vão para a transmissão: nunca dá eco.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Sala de Tela (vai para a transmissão)"
      capture.props = {
        node.name      = "sala_sink"
        media.class    = "Audio/Sink"
        audio.position = [ FL FR ]
        # Prioridade mínima: nunca vira a saída padrão sozinha.
        priority.session = 1
        priority.driver  = 1
      }
      playback.props = {
        node.name        = "sala_sink_saida"
        node.description = "Sala de Tela → saída padrão"
        audio.position   = [ FL FR ]
        node.passive     = true
      }
    }
  }
]
